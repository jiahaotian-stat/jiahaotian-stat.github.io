name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "_pages/**"
      - "_bibliography/**"
      - "_data/**"
      - "_config.yml"
      - "**.html"
      - "**.liquid"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Build site
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
